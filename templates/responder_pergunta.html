{% extends 'base.html' %}
{% block content %}
<div class="form-wrapper">
    <form class="glass-form" action="/recuperar/verificar" method="POST">
        <h1>Pergunta secreta</h1>
        <p>{{ pergunta }}</p>
        {% if erro %}
            <p class="erro">{{ erro }}</p>
        {% endif %}
        <input type="hidden" name="nomeForm" value="{{ nome }}">
        <input type="text" name="respostaForm" placeholder="Sua resposta">
        <button type="submit">Verificar</button>
        <span><a href="/recuperar">Voltar</a></span>
    </form>
</div>
{% endblock %}
