{% extends 'base.html' %}
{% block content %}
<div class="form-wrapper">
    <form class="glass-form" action="/recuperar" method="POST">
        <h1>Recuperar senha</h1>
        <p>Digite seu e-mail cadastrado</p>
        {% if erro %}
            <p class="erro">{{ erro }}</p>
        {% endif %}
        <input type="email" name="emailForm" placeholder="E-mail">
        <button type="submit">Continuar</button>
        <span><a href="/login">Voltar ao login</a></span>
    </form>
</div>
{% endblock %}
